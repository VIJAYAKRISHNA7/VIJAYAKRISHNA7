<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1437"/><stop offset="0.5" stop-color="#1e3a8a"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs>
<rect width="1200" height="220" fill="url(#bg)"/>
<circle cx="1120" cy="30" r="110" fill="#fff" fill-opacity="0.05"><animateTransform attributeName="transform" type="translate" values="0 0;-30 20;0 0" dur="8s" repeatCount="indefinite"/></circle>
<g font-family="'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
<text x="600" y="70" font-size="70" font-weight="800" fill="#7dd3fc" fill-opacity="0.6">&#8220;</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.15;0.18;1" dur="30s" begin="0s" repeatCount="indefinite"/><text x="600" y="115" font-size="28" font-style="italic" font-weight="600" fill="#ffffff">Talk is cheap. Show me the code.</text><text x="600" y="160" font-size="18" fill="#bae6fd" letter-spacing="3">&#8212; LINUS TORVALDS</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.15;0.18;1" dur="30s" begin="5s" repeatCount="indefinite"/><text x="600" y="115" font-size="28" font-style="italic" font-weight="600" fill="#ffffff">First, solve the problem. Then, write the code.</text><text x="600" y="160" font-size="18" fill="#bae6fd" letter-spacing="3">&#8212; JOHN JOHNSON</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.15;0.18;1" dur="30s" begin="10s" repeatCount="indefinite"/><text x="600" y="115" font-size="28" font-style="italic" font-weight="600" fill="#ffffff">Make it work, make it right, make it fast.</text><text x="600" y="160" font-size="18" fill="#bae6fd" letter-spacing="3">&#8212; KENT BECK</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.15;0.18;1" dur="30s" begin="15s" repeatCount="indefinite"/><text x="600" y="115" font-size="28" font-style="italic" font-weight="600" fill="#ffffff">The best way to predict the future is to invent it.</text><text x="600" y="160" font-size="18" fill="#bae6fd" letter-spacing="3">&#8212; ALAN KAY</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.15;0.18;1" dur="30s" begin="20s" repeatCount="indefinite"/><text x="600" y="115" font-size="28" font-style="italic" font-weight="600" fill="#ffffff">Simplicity is the soul of efficiency.</text><text x="600" y="160" font-size="18" fill="#bae6fd" letter-spacing="3">&#8212; AUSTIN FREEMAN</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.15;0.18;1" dur="30s" begin="25s" repeatCount="indefinite"/><text x="600" y="115" font-size="28" font-style="italic" font-weight="600" fill="#ffffff">Build things that solve problems, not things that only look impressive.</text><text x="600" y="160" font-size="18" fill="#bae6fd" letter-spacing="3">&#8212; VIJAYAKRISHNA R.</text></g>
</g></svg>